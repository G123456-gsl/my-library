plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.project.basemodule'
    compileSdk 34

    defaultConfig {
        minSdk 23

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // 补充 Kotlin 编译配置（避免版本兼容问题）
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation("org.jetbrains.kotlin:kotlin-stdlib:1.8.20")

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.google.android.gms:play-services-ads-identifier:17.0.1'
    implementation 'com.tencent:mmkv:1.3.9'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
}

afterEvaluate {
    publishing {
        publications {
            // 定义发布的产物（release 版本）
            release(MavenPublication) {
                // 关联 Android Library 的 release 构件
                from components.release

                // 配置 Maven 坐标（必须唯一，其他项目通过这个引用）
                groupId = 'com.project'      // 组ID：建议用项目包名前缀
                artifactId = 'basemodule'   // 构件ID：模块名
                version = '1.0.2'           // 版本号：后续更新只需改这里

            }
        }

        repositories {
            maven {
                // 本地 Maven 仓库路径（Windows/macOS/Linux 通用）
                url = uri(new File(System.getProperty("user.home"), "MyLibrary").toURI())
            }
        }
    }
}